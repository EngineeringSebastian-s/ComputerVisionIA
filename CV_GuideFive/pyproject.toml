[project]
name = "final-vision-computadora"
version = "0.1.0"
description = "Clasificador de enfermedades de lechuga para SmartPot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
]

[project.optional-dependencies]
ml = [
    "tensorflow; python_version < '3.14'",
]

[project.scripts]
smartpot-lettuce-ai = "smartpot_lettuce_ai.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartpot_lettuce_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
